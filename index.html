<!DOCTYPE html>
<html lang="es">

<body>
  <!-- `deep` arrastra la ventana desde cualquier punto de la barra: Tauri sube
       por el composedPath, así que basta ponerlo aquí una vez. Los elementos
       clicables (a, button, input…) cortan el arrastre ellos solos, de modo que
       atrás, hamburguesa y engranaje siguen respondiendo al clic sin marcarlos. -->
  <header class="appbar" id="appbar" data-tauri-drag-region="deep">
    <div class="appbar-left">
      <span class="traffic-space" aria-hidden="true"></span>
      <button type="button" class="toolbtn burger" id="burger-btn" data-sb="open" aria-label="Contenido del curso" hidden>☰</button>
      <a class="toolbtn back-btn" id="back-btn" href="#/" hidden>
        <span class="back-arrow" aria-hidden="true">←</span><span class="back-label" id="back-label">Inicio</span>
      </a>
      <div class="brand" id="brand">
        <span class="brand-full">Español para brasileños</span>
        <span class="brand-short">Español</span>
        <span class="brand-tag">PT → ES</span>
      </div>
    </div>
    <div class="appbar-right">
      <span class="plabel">Progreso</span>
      <div class="bar"><span id="topbar-bar" style="width:0%"></span></div>
      <span id="topbar-pct">0%</span>
      <a class="toolbtn gear" id="gear-btn" href="#/ajustes" aria-label="Ajustes y sincronización" title="Ajustes">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </a>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" hidden></aside>
    <div class="scrim" id="scrim" hidden></div>
    <main class="wrap" id="app"></main>
  </div>

  <script src="js/version.js"></script>
