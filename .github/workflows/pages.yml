name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # El sello de versión NO se genera aquí: GitHub Pages publica este
      # repositorio desde la rama `main` con su propio compilador
      # ("pages build and deployment"), no desde este artefacto, así que
      # cualquier archivo escrito en este paso se descartaba. Lo escribe
      # scripts/stamp.sh y se commitea. Ver README.

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
