[package]
name = "espanol-para-brasilenos"
version = "1.0.0"
description = "Curso contrastivo de español para hablantes de portugués brasileño"
authors = ["gabrielom"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "espanol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
